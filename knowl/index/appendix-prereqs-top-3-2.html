<div class="para">A subset <span class="process-math">\(A \subseteq \mathbb{R}\)</span> is <dfn class="terminology">open</dfn> if for all <span class="process-math">\(x\in A\)</span> there exists <span class="process-math">\(r&gt;0\)</span> such that <span class="process-math">\((x-r, x+r) \subseteq A\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#appendix-prereqs-top-3-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <div class="para">A subset <span class="process-math">\(B \subseteq \mathbb{R}\)</span> is <dfn class="terminology">closed</dfn> if its complement <span class="process-math">\(\mathbb{R}\backslash B\)</span> is open. <div class="autopermalink" data-description="Paragraph"><a href="#appendix-prereqs-top-3-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
